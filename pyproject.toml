[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topomux"
version = "0.1.0"
description = "FPGA network topology generator"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "numpy"]

[project.scripts]
topomux = "topomux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
